# Infrastructure only. Application services (poller, bridge, replay, Spark) are added in later
# milestones. Image tags are pinned; see DESIGN.md decision 9.

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: sc-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  kafka:
    image: apache/kafka:3.8.0
    container_name: sc-kafka
    ports:
      - "9094:9094"   # host access via localhost:9094
    environment:
      # Single-node KRaft (no ZooKeeper): this node is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # INTERNAL: for containers on this network. EXTERNAL: for the host.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single node, so every replication factor is 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Spark is not part of `docker compose up` (infra only); it runs on demand under the "spark"
  # profile via `make stream` / `make test-spark`. See Makefile.
  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["spark"]
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:9092   # internal listener
      KAFKA_TOPIC: sc.readings
    volumes:
      - ./:/app

volumes:
  mosquitto-data:
  kafka-data:
