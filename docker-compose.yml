# `docker compose up` starts the infrastructure (Mosquitto + Kafka).
# Profiles add the rest on demand:
#   --profile live    poller -> MQTT -> bridge -> Kafka (the live pipeline)
#   --profile spark   the Spark job / batch reprocessor / tests (via the Makefile)
# Image tags are pinned; see DESIGN.md decisions 9 and 16.

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: sc-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  kafka:
    image: apache/kafka:3.8.0
    container_name: sc-kafka
    ports:
      - "9094:9094"   # host access via localhost:9094
    environment:
      # Single-node KRaft (no ZooKeeper): this node is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # INTERNAL: for containers on this network. EXTERNAL: for the host.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single node, so every replication factor is 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Live pipeline (opt in with --profile live). Both services share one app image.
  poller:
    image: sensor-reliability-app
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["live"]
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      SC_USER_AGENT: ${SC_USER_AGENT:-sensor-reliability/0.1 (portfolio)}
      SC_AREA_LAT: "45.4642"
      SC_AREA_LON: "9.1900"
      SC_AREA_RADIUS_KM: "15"
    command: python -m sensor_reliability.poller --sink mqtt

  bridge:
    image: sensor-reliability-app
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["live"]
    depends_on:
      mosquitto:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: sc.readings
    command: python -m sensor_reliability.bridge

  # Spark job / batch reprocessor / tests (opt in with --profile spark), driven by the Makefile.
  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["spark"]
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:9092   # internal listener
      KAFKA_TOPIC: sc.readings
    volumes:
      - ./:/app

volumes:
  mosquitto-data:
  kafka-data:
